<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#fbf6f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1120" media="(prefers-color-scheme: dark)" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
			rel="stylesheet"
		/>

		<script>
			// Resolve the theme before first paint so there is no flash of the wrong palette.
			(() => {
				try {
					const saved = localStorage.getItem('theme');
					const dark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch {
					/* Keep the default theme if storage is unavailable. */
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
